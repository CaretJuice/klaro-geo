# Local and CI run the same checks. pre-commit runs the first four on every
# commit that touches the files they cover; this runs them on every push to
# master and every pull request, and adds the suites that need WordPress.
name: Checks

on:
  push:
    branches: [master]
  pull_request:

# The jobs only read the repository. Actions are pinned to a commit, with the
# release it belongs to beside it; Dependabot (.github/dependabot.yml) opens a
# pull request when a newer release exists.
permissions:
  contents: read

jobs:
  static:
    name: Banned patterns, PHPCS, PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Banned patterns
        run: bin/check-banned-patterns.sh
      - name: PHPCS
        run: vendor/bin/phpcs
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  jest:
    name: Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - run: npx jest

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: PHPUnit
        working-directory: docker
        run: |
          docker compose build wordpress_test
          docker compose run --rm -T wordpress_test vendor/bin/phpunit

  e2e:
    name: Playwright and Plugin Check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox
      - name: Start the E2E site
        run: npm run e2e:setup
      - name: Playwright
        run: npm run e2e:test
      - name: Plugin Check on the build output
        run: bin/plugin-check.sh
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            e2e-report
            test-results
          retention-days: 7
      - name: E2E site log
        if: failure()
        run: docker logs klaro-geo-wordpress-e2e --tail 100
