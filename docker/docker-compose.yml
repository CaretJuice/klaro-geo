# Every WordPress environment of this plugin. Use bin/phpunit.sh and
# bin/site.sh, which call this file with the right options, from any directory.
#
#   phpunit   runs the PHP test suite once and exits      (profile "test")
#   site      WordPress at http://localhost:8080, for the  (profile "site")
#             Playwright tests and for trying things by hand
#   db        the database server both use
#
# Nothing here is kept between runs on purpose. The database lives in memory
# and the site's WordPress files in an anonymous volume, so `bin/site.sh down`
# leaves nothing behind and the next start is the same as a fresh clone's or
# CI's. bin/site.sh reset returns a running site to that state.
#
# The checkout is mounted read-only in both containers. Nothing in them changes
# a file's owner or permissions; the only thing written to the checkout is the
# PHPUnit debug log in docker/logs, by a process running as you.
name: klaro-geo

x-image: &image
  image: klaro-geo-dev:wp${WP_VERSION:-7.1.5}-php${PHP_VERSION:-8.3}
  build:
    context: .
    args:
      WP_VERSION: ${WP_VERSION:-7.1.5}
      PHP_VERSION: ${PHP_VERSION:-8.3}

services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30

  phpunit:
    <<: *image
    profiles: [test]
    # You, so the log it writes is yours. bin/phpunit.sh sets these.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    entrypoint: ["phpunit-entrypoint"]
    command: ["vendor/bin/phpunit"]
    working_dir: /usr/src/wordpress/wp-content/plugins/klaro-geo
    environment:
      WP_TESTS_DB_HOST: db
      WP_TESTS_DB_NAME: wordpress_test
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASSWORD: root
      # Read by the WordPress test library; see tests/phpunit/bootstrap.php.
      WP_PHPUNIT__TESTS_CONFIG: /usr/src/wordpress/wp-content/plugins/klaro-geo/tests/phpunit/wp-tests-config.php
    volumes:
      - ..:/usr/src/wordpress/wp-content/plugins/klaro-geo:ro
      - ./logs:/usr/src/wordpress/wp-content/plugins/klaro-geo/docker/logs
    tmpfs:
      # WordPress core in the image is read-only to this user.
      - /usr/src/wordpress/wp-content/uploads:mode=1777
    depends_on:
      db:
        condition: service_healthy

  site:
    <<: *image
    profiles: [site]
    container_name: klaro-geo-site
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
    volumes:
      - ..:/var/www/html/wp-content/plugins/klaro-geo:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Answers once the WordPress image has copied WordPress into place and
      # written wp-config.php. Installing it is bin/site.sh's job.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/wp-login.php"]
      interval: 2s
      timeout: 5s
      retries: 60
