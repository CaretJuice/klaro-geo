# datalayer-events.spec.yaml
#
# EXTERNAL CONTRACT: every event Klaro Geo pushes to window.dataLayer.
#
# Readers of these events live outside this repo and cannot be updated in the
# same commit: GTM containers on sites that run the plugin, and the
# traffic-diagnostics adapter (client/presets/klaro-geo.js in that repo).
# Renaming an event or a field, or changing when an event fires, is a breaking
# change: add it to breaking_changes below and say so in the changelog.
#
# Verified against the code on 2026-11-19 (plugin 0.3.8).

principles:
  output_only: |
    The dataLayer is the plugin's output channel. Plugin code MUST NOT read its
    own settings or consent state back out of the dataLayer. Consent state comes
    from Klaro's manager; settings come from window.klaroConsentData
    (see frontend-data.spec.yaml).
  event_wrapper: |
    Most events use event: 'Klaro Event' with klaroEventName naming the specific
    event, so one GTM trigger can match them all. 'Klaro Consent Update' has its
    own event name because it is the trigger tags are expected to fire on.
  event_source: |
    eventSource is present only on 'Klaro Event' events:
      'klaro'      the event forwards Klaro library state
      'klaro-geo'  the event is generated by the plugin

events:
  klaroConfigLoaded:
    shape:
      event: "Klaro Event"
      eventSource: "klaro-geo"
      klaroEventName: "klaroConfigLoaded"
    pushed_by: "js/klaro-geo-bootstrap.js (applyResolution), in both geo modes"
    when: "Once per page load, when the template has been resolved and klaroConfig is set"
    fields:
      klaroGeoConsentTemplate: "string - key of the template in use"
      klaroGeoTemplateSource: "string - 'default' | 'fallback' | 'country' | 'region' | 'hardcoded-fallback'"
      klaroGeoDetectedCountry: "string|null"
      klaroGeoDetectedRegion: "string|null"
      klaroGeoAdminOverride: "boolean - admin debug geo override active"
      klaroGeoResolutionMode: "string - 'server' | 'client'"
      klaroGeoGeoSource: "string - 'server' | 'debug' (server mode); 'geoip-ajax' | 'timezone' | 'fallback' (client mode)"
      klaroGeoGeoLatencyMs: "integer|null - null in server mode"
      klaroGeoEnableConsentLogging: "boolean - whether receipts are recorded on this page: the global consent receipts setting AND the template's setting (equals klaroConsentData.enableConsentLogging)"
      klaroGeoGPCDetected: "boolean - navigator.globalPrivacyControl was true and GPC is enabled"
      klaroGeoGPCEnabled: "boolean - GPC handling enabled for this template"
      klaroGeoGPCAffectedServices: "array - services whose default was set to false by GPC"
      klaroGeoConsentReceiptId: "string, optional - latest local receipt ID, only when a stored consent exists"
    rules:
      - "MUST fire exactly once per page load, in both geo resolution modes"
      - "In client mode it fires after the browser resolves the geo, so later than in server mode"

  gpcDetected:
    shape:
      event: "Klaro Event"
      eventSource: "klaro-geo"
      klaroEventName: "gpcDetected"
    when: "After klaroConfigLoaded, only when GPC is enabled and navigator.globalPrivacyControl === true"
    fields:
      klaroGeoGPCAffectedServices: "array"

  klaro_forwarded_events:
    shape:
      event: "Klaro Event"
      eventSource: "klaro"
      klaroEventName: "initialConsents | saveConsents | applyConsents | (other Klaro watcher event names)"
    pushed_by: "js/klaro-geo.js"
    fields:
      klaroEventData: "the data Klaro passed to its watcher (for initialConsents: a copy of the consents map)"
      acceptedServices: "array - names of services currently consented"
    rules:
      - "initialConsents is pushed once per page load, when Klaro's manager is available"
      - "saveConsents and applyConsents are always forwarded"
      - "Other Klaro watcher events are forwarded only when the 'suppress consents events' setting is off (it is on by default)"

  generateConsentReceipt:
    shape:
      event: "Klaro Event"
      eventSource: "klaro-geo"
      klaroEventName: "generateConsentReceipt"
    when: |
      When klaroConsentData.enableConsentLogging is true: on saveConsents
      (type 'choice'), and once per browser on page load when GPC was applied
      and the visitor has no saved choice (type 'gpc').
    fields:
      klaroGeoConsentReceipt: "string - receipt ID"
      klaroGeoConsentReceiptType: "string - 'choice' | 'gpc'"
      klaroGeoTemplateSource: "string"
      klaroGeoAdminOverride: "boolean"
      klaroGeoEnableConsentLogging: "boolean - always true when this event fires"

  queueFlushed:
    shape:
      event: "Klaro Event"
      eventSource: "klaro-geo"
      klaroEventName: "queueFlushed"
    when: "After the consent queue drains; not pushed when the queue was empty (see consent-queue.spec.yaml)"
    fields:
      queueSize: "integer - number of events flushed"

  klaroConsentUpdate:
    shape:
      event: "Klaro Consent Update"
    pushed_by: "js/klaro-geo.js, after it calls gtag('consent', 'update', ...)"
    when: "On initialConsents and on every saveConsents"
    fields:
      consent_trigger: "string - 'initialConsents' | 'saveConsents'"
      consentMode: "object - every consent key with 'granted' | 'denied' (keys: see frontend-data.spec.yaml)"
      acceptedServices: "array - names of services currently consented"
      gpcActive: "boolean"
    rules:
      - "MUST always include the four Google keys: ad_storage, analytics_storage, ad_user_data, ad_personalization"
      - "MUST include a key for every Klaro service; denied services are 'denied', never omitted"
      - "gtag('consent', 'update') is called BEFORE this event is pushed"
      - "Basic GTM mode: NOT pushed for initialConsents while the google-tag-manager service is not consented (it would release the consent queue before GTM can load)"
      - "Advanced mode: always pushed for initialConsents"
      - "MUST still be pushed when the values equal the consent defaults; only the redundant gtag('consent','update') call is skipped in that case"
      - "It is the event that releases the consent queue"

head_consent_defaults:
  description: |
    Not a dataLayer event object but part of the same contract: in the <head>
    the plugin calls gtag('consent', 'default', {...}) with every consent key and
    wait_for_update: 500, and gtag('set', ...) for ads_data_redaction and
    url_passthrough when the template enables them. In client geo mode the
    defaults come from the fallback template and the resolver follows up with
    gtag('consent', 'update') for the selected template.

consumers:
  gtm: |
    Tags fire on the 'Klaro Consent Update' custom event, or use GTM's built-in
    consent checks against the consent keys. The acceptedServices array supports
    the older Trigger Group setup.
  traffic_diagnostics: |
    client/presets/klaro-geo.js reads klaroConfigLoaded (klaroGeoConsentTemplate,
    klaroGeoTemplateSource, klaroGeoDetectedCountry, klaroGeoDetectedRegion,
    klaroGeoGPCDetected) and 'Klaro Consent Update' (consent_trigger,
    consentMode). Check it still parses after any change here.

breaking_changes:
  - plugin_version: "0.3.8"
    change: "klaroGeoEnableConsentLogging in klaroConfigLoaded is false whenever consent receipts are disabled globally"
    reason: |
      It reported the template's own setting, so it could be true on a site
      that records no receipts. It now matches
      klaroConsentData.enableConsentLogging.
    migration: "None needed unless a tag relied on the template's setting while receipts were off"

  - plugin_version: "0.3.8"
    change: "generateConsentReceipt also fires for a GPC opt-out with no saved choice; klaroGeoConsentReceiptType added"
    reason: |
      A visitor whose browser sends GPC is opted out without touching the
      banner, and that opt-out was not recorded anywhere.
    migration: "A tag that must fire only for saved choices adds the condition klaroGeoConsentReceiptType equals 'choice'"

  - plugin_version: "0.3.8"
    change: "Removed the 'Klaro Geo Consent Receipt' event"
    reason: |
      It was only pushed by js/klaro-geo-consent-receipts.js, which waited for
      'klaro:consent-change' DOM events that Klaro never dispatches, so it never
      fired. That script is deleted.
    migration: "Trigger on 'Klaro Event' with klaroEventName equals 'generateConsentReceipt'"

  - plugin_version: "earlier (spec history)"
    change: "'Klaro Consent Data' replaced by gtag('consent','update') plus 'Klaro Consent Update'"
    migration: "GTM triggers on 'Klaro Consent Data' must change to 'Klaro Consent Update'"

  - plugin_version: "earlier (spec history)"
    change: "klaroConfig removed from forwarded Klaro events; eventSource removed from events that are not 'Klaro Event'"
    migration: "Read window.klaroConfig; filter on the event name instead of eventSource"

  - plugin_version: "earlier (spec history)"
    change: "initialConsents eventSource changed from 'klaro-geo' to 'klaro'"
    migration: "Filter on klaroEventName === 'initialConsents'"
